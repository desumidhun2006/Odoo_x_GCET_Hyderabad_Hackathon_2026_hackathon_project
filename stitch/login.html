<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign in — StockSense IMS</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen flex items-center justify-center" style="background:#0F172A;font-family:system-ui">
<div class="w-full max-w-sm rounded-xl p-8 shadow-xl" style="background:#fff">
<div class="flex items-center gap-2 mb-1"><span class="material-symbols-outlined" style="color:#2563EB">warehouse</span>
<span class="text-xl font-bold tracking-tight">StockSense IMS</span></div>
<p class="text-sm mb-1" style="color:#45464d">Sign in to the inventory command center</p>
<p class="text-xs mb-6 px-2 py-1 rounded-full inline-block" style="background:#FFFBEB;color:#D97706">DEMO login — real auth is member-2's module</p>
<form id="loginForm" class="flex flex-col gap-3">
<input id="email" type="email" required placeholder="you@warehouse.com" value="demo@stocksense.local"
class="px-3 py-2 rounded-lg border text-sm" style="border-color:#CBD5E1"/>
<input id="pass" type="password" required placeholder="Password" value="demo1234"
class="px-3 py-2 rounded-lg border text-sm" style="border-color:#CBD5E1"/>
<button type="submit" class="py-2 rounded-lg text-white text-sm font-semibold" style="background:#2563EB">Sign in</button>
</form>
<p id="loginMsg" class="text-sm mt-3" style="color:#DC2626"></p>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  if (!email) { document.getElementById('loginMsg').textContent = 'Enter an email'; return; }
  try { localStorage.setItem('stocksense_user', JSON.stringify({ email: email, at: Date.now() })); } catch (err) {}
  location.href = '/dashboard.html';
});
</script>
</body></html>
