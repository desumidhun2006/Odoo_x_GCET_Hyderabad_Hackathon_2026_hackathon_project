<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSense — Sign In</title>
  <meta name="description" content="Sign in to StockSense inventory." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><path d='M30 40 L50 28 L70 40 L50 52 Z M30 44 L50 56 L50 74 L30 62 Z M70 44 L50 56 L50 74 L70 62 Z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="light-glass-theme">

  <!-- CRYSTAL LIQUID PRISM BACKGROUND -->
  <div class="crystal-ambient" aria-hidden="true">
    <div class="prism-orb prism-indigo"></div>
    <div class="prism-orb prism-cyan"></div>
    <div class="prism-orb prism-amber"></div>
    <div class="prism-orb prism-rose"></div>
    <div class="crystal-caustic"></div>
    <div class="crystal-mesh"></div>
    <div class="crystal-grain"></div>
  </div>

  <!-- ═══════════════════════ SIGN-IN CARD ═══════════════════════ -->
  <div class="crystal-modal-overlay" id="loginWrap">
    <div class="crystal-modal" style="max-width: 440px;">
      <div class="modal-top">
        <div class="modal-title-group">
          <span class="m-icon">📦</span>
          <div>
            <h2>StockSense</h2>
            <div style="font-size:0.8rem; color:var(--text-muted)">Enterprise Inventory Ledger</div>
          </div>
        </div>
      </div>

      <div style="display:flex; gap:0.5rem; background:var(--bg-glass-subtle); padding:0.3rem; border-radius:var(--radius-md);">
        <button class="crystal-btn primary" id="tabLogin" style="flex:1;">Sign In</button>
        <button class="crystal-btn secondary" id="tabRegister" style="flex:1;">Register</button>
      </div>

      <div class="crystal-form-grid" style="grid-template-columns: 1fr;">
        <div class="form-group" id="nameGroup" style="display:none;">
          <label>Full Name</label>
          <input type="text" id="fName" placeholder="e.g. Demo Manager" autocomplete="name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="fEmail" placeholder="demo@stocksense.io" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="fPass" placeholder="••••••••" autocomplete="current-password" />
        </div>
      </div>

      <div id="errBox" class="hidden" style="background:rgba(220,38,38,0.08); border:1px solid rgba(220,38,38,0.25); color:var(--rose); font-size:0.85rem; font-weight:600; padding:0.6rem 1rem; border-radius:var(--radius-md);"></div>

      <div class="modal-bottom" style="justify-content:stretch; flex-direction:column;">
        <button class="crystal-btn primary" id="submitBtn" style="width:100%;">Sign In →</button>
        <button class="crystal-btn secondary" id="demoBtn" style="width:100%;">Fill demo credentials</button>
      </div>

      <div style="font-family:var(--font-mono); font-size:0.72rem; color:var(--text-dim); text-align:center;">
        Demo login — <strong>demo@stocksense.io</strong> / <strong>Demo@1234</strong>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════ TOAST ═══════════════════════ -->
  <div class="crystal-toast hidden" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
